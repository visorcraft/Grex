name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore grex.sln

      - name: Build solution
        run: dotnet build grex.sln -p:Platform=x64 --configuration Release --no-restore

      # Tests intentionally not run in this workflow

      - name: Publish application
        run: dotnet publish Grex.csproj -p:Platform=x64 -c Release -o publish/win-x64

      - name: Package artifacts
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath grex-win-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: grex-win-x64
          path: grex-win-x64.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: grex-win-x64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/grex-win-x64.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
