name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore grex.sln

      - name: Build solution
        run: dotnet build grex.sln -p:Platform=x64 --configuration Release --no-restore

      - name: Test solution
        run: dotnet test grex.sln -p:Platform=x64 --configuration Release --no-build --blame-hang --blame-hang-timeout 3m -m:1

      - name: Publish, package, and build installer
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}   # via env (not inline) to avoid script injection
        run: |
          $ErrorActionPreference = 'Stop'
          $v = "$env:REF_NAME" -replace '^v', ''
          $gui = "dist\grex-$v-win-x64"
          $cli = "dist\grex-cli-$v-win-x64"

          # Self-contained publishes (match build.ps1 / what the installer bundles).
          dotnet publish Grex.csproj -p:Platform=x64 -c Release -r win-x64 --self-contained -o $gui
          if ($LASTEXITCODE) { throw "GUI publish failed ($LASTEXITCODE)" }
          dotnet publish Grex.Cli/Grex.Cli.csproj -p:Platform=x64 -c Release -r win-x64 --self-contained -o $cli
          if ($LASTEXITCODE) { throw "CLI publish failed ($LASTEXITCODE)" }

          # Portable zips.
          Compress-Archive -Path "$gui\*" -DestinationPath "dist\grex-$v-win-x64.zip" -Force
          Compress-Archive -Path "$cli\*" -DestinationPath "dist\grex-cli-$v-win-x64.zip" -Force

          # Installer (Inno Setup is preinstalled on the runner; fall back to choco if not).
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup *\ISCC.exe', 'C:\Program Files\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$gui" "/DCliDir=$cli" "/DOutputDir=dist" Grex.iss
          if ($LASTEXITCODE) { throw "Inno Setup compile failed ($LASTEXITCODE)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: grex-release
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: grex-release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
