name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore grex.sln -p:Platform=x64

      - name: Build solution
        run: dotnet build grex.sln -p:Platform=x64 --configuration Release --no-restore

      - name: Test solution
        run: dotnet test grex.sln -p:Platform=x64 --configuration Release --no-build
