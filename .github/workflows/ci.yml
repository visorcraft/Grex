name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore grex.sln -p:Platform=x64

      - name: Build solution
        run: dotnet build grex.sln -p:Platform=x64 --configuration Release --no-restore

      - name: Test unit suite
        timeout-minutes: 10
        run: dotnet test Tests/Grex.Tests.csproj -p:Platform=x64 -p:WindowsAppSdkBootstrapInitialize=false --configuration Release --no-restore --blame-hang --blame-hang-timeout 3m

      - name: Test CLI suite
        timeout-minutes: 10
        run: dotnet test Tests/Grex.Cli.Tests/Grex.Cli.Tests.csproj -p:Platform=x64 -p:WindowsAppSdkBootstrapInitialize=false --configuration Release --no-restore --blame-hang --blame-hang-timeout 3m

      - name: Test integration suite
        timeout-minutes: 10
        run: dotnet test IntegrationTests/Grex.IntegrationTests.csproj -p:Platform=x64 -p:WindowsAppSdkBootstrapInitialize=false --configuration Release --no-restore --blame-hang --blame-hang-timeout 3m

      - name: Test UI suite
        timeout-minutes: 10
        run: dotnet test UITests/Grex.UITests.csproj -p:Platform=x64 -p:WindowsAppSdkBootstrapInitialize=false --configuration Release --no-restore --blame-hang --blame-hang-timeout 3m
